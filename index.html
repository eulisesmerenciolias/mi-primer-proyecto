<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><link rel="manifest" href="manifest.webmanifest"><title>Cuba Ruta</title><style>
:root{--n:#10243a;--b:#176b87;--bg:#f3f6f8;--ink:#172b3a;--muted:#657786;--line:#e1e8ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:var(--n);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:850}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#b9d4df}.wrap{padding:20px}.muted{color:var(--muted);font-size:13px}.notice{background:#fff4dd;color:#704d12;padding:12px;border-radius:9px;margin:12px 0;font-size:13px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn,.tabs button{border:0;border-radius:8px;padding:10px 14px;background:#e4edf1;color:var(--ink);font-weight:650}.primary{background:var(--b)!important;color:white!important}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.big{font-size:26px;font-weight:800}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field select,.field textarea{padding:10px;border:1px solid #d4dfe5;border-radius:8px;width:100%}.field textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#edf2f5;border-radius:20px;padding:4px 8px;font-size:11px}.chat{height:280px;overflow:auto;background:#f6f8f9;border:1px solid var(--line);border-radius:9px;padding:10px}.msg{background:white;border:1px solid var(--line);border-radius:10px;padding:8px;margin:7px;max-width:80%}.mine{margin-left:auto;background:#dff3f5}.hidden{display:none!important}.auth{max-width:460px;margin:35px auto}.footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}@media(max-width:650px){.grid,.formgrid{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:12px}}
</style></head><body><div class="app"><header class="top"><div class="brand">CUBA RUTA<small>TRANSPORTE · CONFIANZA · CONEXIÓN</small></div><div><span id="who"></span> <button id="out" class="btn hidden">Salir</button></div></header><main id="root" class="wrap"></main><footer class="footer">Cuba Ruta · Piloto de pruebas</footer></div>
<script>
const K='cr_pilot_v3';let db;try{db=JSON.parse(localStorage.getItem(K))||{users:[],trips:[],offers:[],messages:[],vehicles:[]}}catch(e){db={users:[],trips:[],offers:[],messages:[],vehicles:[]}}let me=JSON.parse(sessionStorage.getItem('cr_me')||'null'),tab='home',chatId=null;
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(K,JSON.stringify(db)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){if(db.users.length)return;db.users=[{id:1,name:'Administrador',email:'admin@demo.cu',pass:'demo123',role:'admin',phone:'—'},{id:2,name:'Cliente de prueba',email:'cliente@demo.cu',pass:'demo123',role:'client',phone:'+53 50000000'},{id:3,name:'Transportista de prueba',email:'transportista@demo.cu',pass:'demo123',role:'driver',phone:'+53 51111111'}];db.trips=[{id:101,clientId:2,clientName:'Cliente de prueba',category:'Contenedor',origin:'TC Mariel',destination:'La Habana',cargo:'Contenedor 20 pies',date:new Date().toISOString().slice(0,10),details:'Viaje de ejemplo',status:'Publicado'}];save()}seed();
function auth(mode){$('#who').textContent='';$('#out').classList.add('hidden');$('#root').innerHTML='<div class="auth card"><h2>Cuba Ruta</h2><p class="muted">Entra o crea una cuenta de prueba.</p><div class="tabs"><button onclick="auth(\'login\')">Entrar</button><button onclick="auth(\'register\')">Registrarme</button></div><div id="af"></div></div>';mode=mode||'login';if(mode==='register')$('#af').innerHTML='<form onsubmit="register(event)"><div class="field"><label>Nombre y apellidos</label><input name="name" required></div><div class="field"><label>Correo</label><input name="email" type="email" required></div><div class="field"><label>Teléfono / WhatsApp</label><input name="phone" required></div><div class="field"><label>Perfil</label><select name="role"><option value="client">Cliente</option><option value="driver">Transportista</option></select></div><div class="field"><label>Contraseña</label><input name="pass" type="password" minlength="6" required></div><button class="btn primary">Crear cuenta</button></form>';else $('#af').innerHTML='<form onsubmit="login(event)"><div class="field"><label>Correo</label><input name="email" type="email" required></div><div class="field"><label>Contraseña</label><input name="pass" type="password" required></div><button class="btn primary">Entrar</button></form><div class="notice">Cuentas demo: admin@demo.cu, cliente@demo.cu o transportista@demo.cu. Contraseña: demo123</div>'}
function login(e){e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.email===f.get('email').toLowerCase()&&x.pass===f.get('pass'));if(!u)return alert('Datos incorrectos');setMe(u)}
function register(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase();if(db.users.some(u=>u.email===email))return alert('Ese correo ya está registrado');let u={id:Date.now(),name:f.get('name'),email,phone:f.get('phone'),role:f.get('role'),pass:f.get('pass')};db.users.push(u);save();setMe(u)}
function setMe(u){me={id:u.id,name:u.name,email:u.email,role:u.role};sessionStorage.setItem('cr_me',JSON.stringify(me));render()}
function logout(){me=null;sessionStorage.removeItem('cr_me');auth()}
function nav(){return '<div class="tabs"><button onclick="go(\'home\')">Inicio</button><button onclick="go(\'trips\')">Viajes</button>'+(me.role==='driver'?'<button onclick="go(\'vehicles\')">Mis vehículos</button>':'')+(me.role==='admin'?'<button onclick="go(\'admin\')">Administración</button>':'')+'</div><div id="screen"></div>'}
function render(){if(!me||!db.users.some(u=>u.id===me.id))return auth();$('#who').textContent=me.name+' · '+me.role;$('#out').classList.remove('hidden');$('#out').onclick=logout;$('#root').innerHTML=nav();({home,trips,vehicles,admin}[tab]||home)()}
function go(t){tab=t;render()}
function cardTrip(t){let os=db.offers.filter(o=>o.tripId===t.id);return '<div class="card"><div class="row"><b>#'+t.id+' · '+esc(t.category)+'</b><span class="pill">'+esc(t.status)+'</span></div><h3>'+esc(t.origin)+' → '+esc(t.destination)+'</h3><p>'+esc(t.cargo)+' · '+esc(t.date)+'</p><p class="muted">Cliente: '+esc(t.clientName)+'</p><p class="muted">'+esc(t.details)+'</p><div class="actions"><button class="btn" onclick="chat('+t.id+')">Chat</button>'+(me.role==='driver'&&t.status==='Publicado'?'<button class="btn primary" onclick="offer('+t.id+')">Enviar oferta</button>':'')+(me.role==='client'&&t.clientId===me.id?'<button class="btn primary" onclick="offers('+t.id+')">Ver ofertas ('+os.length+')</button>':'')+'</div></div>'}
function home(){let list=me.role==='client'?db.trips.filter(t=>t.clientId===me.id):db.trips;$('#screen').innerHTML='<h1>Hola, '+esc(me.name)+'</h1><p class="muted">'+(me.role==='client'?'Solicita transporte y recibe propuestas.':me.role==='driver'?'Consulta cargas y presenta tus ofertas.':'Supervisa la actividad de Cuba Ruta.')+'</p><div class="grid"><div class="card">Viajes<div class="big">'+db.trips.length+'</div></div><div class="card">Transportistas<div class="big">'+db.users.filter(u=>u.role==='driver').length+'</div></div><div class="card">Ofertas<div class="big">'+db.offers.length+'</div></div></div>'+(me.role==='client'?'<button class="btn primary" onclick="newTrip()">＋ Solicitar transporte</button>':'')+'<div class="notice">PILOTO LOCAL: los registros y el chat solo se guardan en este navegador. No se sincronizan con otros teléfonos todavía. No introduzcas datos reales ni documentos.</div><h2>Viajes recientes</h2>'+list.slice().reverse().map(cardTrip).join('')}
function trips(){let list=me.role==='client'?db.trips.filter(t=>t.clientId===me.id):db.trips.filter(t=>t.status==='Publicado'||db.offers.some(o=>o.tripId===t.id&&o.driverId===me.id));$('#screen').innerHTML='<h1>Viajes</h1>'+(me.role==='client'?'<button class="btn primary" onclick="newTrip()">＋ Solicitar transporte</button>':'')+list.slice().reverse().map(cardTrip).join('')}
function newTrip(){$('#screen').innerHTML='<div class="card"><h2>Nueva solicitud</h2><form onsubmit="saveTrip(event)"><div class="formgrid"><div class="field"><label>Servicio</label><select name="category"><option>Contenedor</option><option>Mudanza</option><option>Carga agrícola</option><option>Mercancía empresarial</option><option>Carga general</option></select></div><div class="field"><label>Fecha deseada</label><input type="date" name="date" required></div><div class="field"><label>Origen</label><input name="origin" required></div><div class="field"><label>Destino</label><input name="destination" required></div><div class="field"><label>Carga</label><input name="cargo" required></div><div class="field"><label>Presupuesto (opcional)</label><input name="budget" type="number" min="0"></div></div><div class="field"><label>Detalles, peso, dimensiones, moneda y contacto</label><textarea name="details"></textarea></div><button class="btn primary">Publicar solicitud</button></form></div>'}
function saveTrip(e){e.preventDefault();let f=new FormData(e.target);db.trips.push({id:Date.now(),clientId:me.id,clientName:me.name,category:f.get('category'),date:f.get('date'),origin:f.get('origin'),destination:f.get('destination'),cargo:f.get('cargo'),budget:Number(f.get('budget')||0),details:f.get('details'),status:'Publicado'});save();go('trips')}
function offer(id){let a=prompt('Importe que quieres recibir por el viaje');if(a===null)return;let amount=Number(a);if(amount<=0)return alert('Importe no válido');let currency=prompt('Moneda: USD o CUP','USD')||'USD';db.offers.push({id:Date.now(),tripId:id,driverId:me.id,driverName:me.name,amount,currency,status:'Pendiente'});save();alert('Oferta registrada');go('trips')}
function offers(id){let os=db.offers.filter(o=>o.tripId===id);$('#screen').innerHTML='<div class="card"><h2>Ofertas recibidas</h2>'+(os.length?os.map(o=>'<div class="card"><b>'+esc(o.driverName)+'</b><div class="big">'+o.amount+' '+esc(o.currency)+'</div><span class="pill">'+o.status+'</span><div class="actions"><button class="btn primary" onclick="accept('+o.id+')">Aceptar</button><button class="btn" onclick="chat('+id+')">Conversar</button></div></div>').join(''):'<p>Aún no hay ofertas.</p>')+'</div>'}
function accept(id){let o=db.offers.find(x=>x.id===id),t=db.trips.find(x=>x.id===o.tripId);db.offers.forEach(x=>{if(x.tripId===t.id)x.status=x.id===id?'Aceptado':'No seleccionada'});t.status='En curso';t.driverId=o.driverId;t.driverName=o.driverName;save();chat(t.id)}
function chat(id){chatId=id;let msgs=db.messages.filter(m=>m.tripId===id);$('#screen').innerHTML='<div class="card"><h2>Chat del viaje #'+id+'</h2><div id="msgs" class="chat">'+(msgs.map(m=>'<div class="msg '+(m.userId===me.id?'mine':'')+'"><b>'+esc(m.name)+'</b><br>'+esc(m.text)+'<div class="muted">'+new Date(m.at).toLocaleString('es')+'</div></div>').join('')||'Inicia la conversación.')+'</div><form onsubmit="send(event)" class="actions"><input name="text" required placeholder="Escribe un mensaje..." style="flex:1;min-width:160px;padding:10px;border:1px solid #ccd8df;border-radius:8px"><button class="btn primary">Enviar</button></form></div>';$('#msgs').scrollTop=$('#msgs').scrollHeight}
function send(e){e.preventDefault();let text=new FormData(e.target).get('text');db.messages.push({id:Date.now(),tripId:chatId,userId:me.id,name:me.name,text,at:new Date().toISOString()});save();chat(chatId)}
function vehicles(){let vs=db.vehicles.filter(v=>v.ownerId===me.id);$('#screen').innerHTML='<h1>Mis vehículos</h1><button class="btn primary" onclick="addVehicle()">＋ Añadir vehículo</button>'+vs.map(v=>'<div class="card"><b>'+esc(v.plate)+'</b> · '+esc(v.type)+'<p>'+esc(v.capacity)+'</p></div>').join('')}
function addVehicle(){let plate=prompt('Matrícula'),type=prompt('Tipo de vehículo'),capacity=prompt('Capacidad / tipo de carga');if(plate&&type){db.vehicles.push({id:Date.now(),ownerId:me.id,plate,type,capacity});save();vehicles()}}
function admin(){if(me.role!=='admin')return go('home');$('#screen').innerHTML='<h1>Panel de administración</h1><div class="grid"><div class="card">Usuarios<div class="big">'+db.users.length+'</div></div><div class="card">Viajes<div class="big">'+db.trips.length+'</div></div><div class="card">Ofertas<div class="big">'+db.offers.length+'</div></div></div><h2>Usuarios</h2>'+db.users.map(u=>'<div class="card">'+esc(u.name)+' · '+esc(u.email)+' · '+esc(u.role)+'</div>').join('')+'<h2>Todos los viajes</h2>'+db.trips.slice().reverse().map(cardTrip).join('')}
$('#out').onclick=logout;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});if(me)render();else auth('login');
</script></main></div></body></html>
