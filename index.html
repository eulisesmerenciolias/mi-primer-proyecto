<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10243a"><title>Cuba Ruta | Administración</title>
<style>
:root{--navy:#10243a;--blue:#176b87;--cyan:#dff3f5;--bg:#f3f6f8;--ink:#172b3a;--muted:#657786;--line:#e1e8ed;--white:#fff;--green:#16845b;--orange:#bd7415;--red:#b84040}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 15px;display:flex;flex-direction:column;gap:22px}.brand{font-size:21px;font-weight:800;letter-spacing:.2px}.brand small{display:block;font-size:11px;color:#a9c5d4;font-weight:500;letter-spacing:1.5px}.nav{display:grid;gap:6px}.nav button{border:0;text-align:left;padding:11px 12px;border-radius:9px;background:transparent;color:#d9e6ed}.nav button.active,.nav button:hover{background:#21465f;color:white}.sidefoot{margin-top:auto;color:#a9c5d4;font-size:12px}.main{min-width:0}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top strong{font-size:16px}.top span{color:var(--muted);font-size:12px}.content{padding:26px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.head h1{font-size:25px;margin:0 0 4px}.muted{color:var(--muted)}.btn{border:0;background:var(--blue);color:white;border-radius:8px;padding:10px 14px;font-weight:650}.btn.secondary{background:#eaf1f4;color:var(--ink)}.btn.danger{background:#faeaea;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 8px #12283b08}.kpi label{color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:27px;margin:7px 0 2px}.kpi small{color:var(--muted)}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.sectiontitle{font-weight:750;margin:0 0 13px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafb;color:var(--muted);font-weight:650}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:11px;font-weight:700;background:#edf2f5;color:#536675}.pill.green{background:#e3f5ec;color:var(--green)}.pill.orange{background:#fff1dc;color:var(--orange)}.pill.red{background:#fae9e9;color:var(--red)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d6e0e6;border-radius:8px;padding:10px;background:white;color:var(--ink);width:100%}.toolbar input{max-width:300px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:650}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal{position:fixed;inset:0;background:#08182788;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{background:white;border-radius:14px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.dialog h2{margin:0 0 16px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:9px;background:#fff6e6;color:#775018;font-size:12px;margin-bottom:16px}.chart{display:flex;gap:8px;align-items:end;height:125px;padding-top:12px}.bar{flex:1;background:#5ca2b6;border-radius:5px 5px 0 0;min-width:10px;position:relative}.bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}.actions{display:flex;gap:6px}.link{color:var(--blue);background:none;border:0;font-weight:700}.mobilemenu{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px;gap:10px}.brand{font-size:18px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.sidefoot{display:none}.top{height:54px;padding:0 16px}.content{padding:17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.head h1{font-size:21px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.kpi strong{font-size:22px}.formgrid{grid-template-columns:1fr}.head{align-items:center}}
</style></head>
<body><div class="shell">
<aside class="side"><div class="brand">CUBA RUTA<small>GESTIÓN DE TRANSPORTE</small></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard">▦　Resumen</button><button data-page="trips">⇄　Viajes</button><button data-page="drivers">♙　Transportistas</button><button data-page="clients">▤　Clientes</button><button data-page="vehicles">▰　Vehículos</button><button data-page="finance">＄　Finanzas y pagos</button><button data-page="settings">⚙　Configuración</button>
</nav><div class="sidefoot">Panel de administración<br>Prototipo MVP · Datos locales</div></aside>
<main class="main"><header class="top"><strong id="topTitle">Resumen general</strong><span>Administrador · <b id="today"></b></span></header><section class="content" id="view"></section></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="modalForm"></form></div></div>
<script>
const KEY='cubaruta_mvp_v1';
const seed={rate:480,rateSource:'Manual',rateUpdated:new Date().toISOString(),commission:10,trips:[
{id:1,category:'Contenedor',origin:'TC Mariel',destination:'La Habana',cargo:'Contenedor 20 pies',client:'Importadora Demo',driver:'Carlos Pérez',vehicle:'KJH-123',offer:180,driverPay:160,currency:'USD',status:'Publicado',date:new Date().toISOString().slice(0,10),notes:'Ejemplo demostrativo'},
{id:2,category:'Mudanza',origin:'Vedado',destination:'Playa',cargo:'Mudanza de vivienda',client:'María Gómez',driver:'Luis Díaz',vehicle:'B-456789',offer:75,driverPay:68,currency:'USD',status:'Entregado',date:new Date().toISOString().slice(0,10),notes:''},
{id:3,category:'Carga agrícola',origin:'Güira de Melena',destination:'La Habana',cargo:'Productos agrícolas',client:'Productor Demo',driver:'',vehicle:'',offer:0,driverPay:0,currency:'USD',status:'Solicitado',date:new Date().toISOString().slice(0,10),notes:''}
],drivers:[{id:1,name:'Carlos Pérez',type:'Propietario particular',phone:'+53 5 000 0000',verified:'Pendiente',rating:'—'},{id:2,name:'Luis Díaz',type:'Vehículo arrendado',phone:'+53 5 111 1111',verified:'Pendiente',rating:'—'}],clients:[{id:1,name:'Importadora Demo',type:'Empresa',phone:'—'},{id:2,name:'María Gómez',type:'Particular',phone:'—'},{id:3,name:'Productor Demo',type:'Productor agrícola',phone:'—'}],vehicles:[{id:1,plate:'KJH-123',kind:'Cabezal + rastra',owner:'Carlos Pérez',capacity:'Contenedor 20/40 pies',status:'Activo'},{id:2,plate:'B-456789',kind:'Camión',owner:'Luis Díaz',capacity:'Mudanzas y carga general',status:'Activo'}],payments:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch{db=seed}function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const $=s=>document.querySelector(s);const money=(n,c='USD')=>new Intl.NumberFormat('es',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){let c=['Entregado','Pagado','Activo','Verificado'].includes(s)?'green':['Solicitado','Pendiente','Publicado','En curso'].includes(s)?'orange':['Cancelado','Incidencia','Rechazado'].includes(s)?'red':'';return '<span class="pill '+c+'">'+esc(s)+'</span>'}
function page(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let names={dashboard:'Resumen general',trips:'Gestión de viajes',drivers:'Transportistas',clients:'Clientes',vehicles:'Vehículos',finance:'Finanzas y pagos',settings:'Configuración'};$('#topTitle').textContent=names[p];({dashboard,trips,drivers,clients,vehicles,finance,settings}[p])()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});$('#today').textContent=new Date().toLocaleDateString('es');
function dashboard(){let active=db.trips.filter(t=>!['Entregado','Cancelado'].includes(t.status)).length,done=db.trips.filter(t=>t.status==='Entregado').length,volume=db.trips.reduce((a,t)=>a+(+t.offer||0),0),commission=db.trips.reduce((a,t)=>a+Math.max(0,(+t.offer||0)-(+t.driverPay||0)),0);$('#view').innerHTML=`
<div class="head"><div><h1>Panel de control</h1><div class="muted">Vista general de la operación de Cuba Ruta</div></div><button class="btn" onclick="openTrip()">＋ Nuevo viaje</button></div>
<div class="notice">Prototipo funcional: los registros se guardan en este navegador. Los datos de ejemplo son ficticios. Todavía no hay cuentas de usuario, base de datos compartida ni cobros bancarios integrados.</div>
<div class="grid"><div class="card kpi"><label>Viajes registrados</label><strong>${db.trips.length}</strong><small>Total en el sistema</small></div><div class="card kpi"><label>Viajes activos</label><strong>${active}</strong><small>Solicitados, publicados o en curso</small></div><div class="card kpi"><label>Viajes entregados</label><strong>${done}</strong><small>Con entrega registrada</small></div><div class="card kpi"><label>Volumen publicado</label><strong>${money(volume)}</strong><small>Suma de ofertas registradas</small></div></div>
<div class="two"><div class="card"><h3 class="sectiontitle">Últimos viajes</h3>${tripTable(db.trips.slice(-5).reverse(),false)}</div><div class="card"><h3 class="sectiontitle">Actividad de la plataforma</h3><p>Transportistas registrados: <b>${db.drivers.length}</b></p><p>Clientes registrados: <b>${db.clients.length}</b></p><p>Vehículos registrados: <b>${db.vehicles.length}</b></p><p>Comisión estimada registrada: <b>${money(commission)}</b></p><p class="muted">La comisión se calcula como diferencia entre oferta al cliente e importe del transportista.</p></div></div>`}
function tripTable(items,actions=true){if(!items.length)return '<div class="empty">No hay viajes registrados.</div>';return '<div class="tablewrap"><table><thead><tr><th>ID / Servicio</th><th>Trayecto</th><th>Cliente</th><th>Transportista</th><th>Oferta</th><th>Estado</th>'+(actions?'<th>Acciones</th>':'')+'</tr></thead><tbody>'+items.map(t=>'<tr><td>#'+t.id+' · '+esc(t.category)+'<br><span class="muted">'+esc(t.cargo)+'</span></td><td>'+esc(t.origin)+' → '+esc(t.destination)+'</td><td>'+esc(t.client||'—')+'</td><td>'+esc(t.driver||'Sin asignar')+'</td><td>'+money(t.offer,t.currency)+'</td><td>'+status(t.status)+'</td>'+(actions?'<td><div class="actions"><button class="link" onclick="editTrip('+t.id+')">Editar</button><button class="link" onclick="advanceTrip('+t.id+')">Estado</button></div></td>':'')+'</tr>').join('')+'</tbody></table></div>'}
function trips(){ $('#view').innerHTML='<div class="head"><div><h1>Viajes</h1><div class="muted">Contenedores, mudanzas, cargas agrícolas y mercancías generales</div></div><button class="btn" onclick="openTrip()">＋ Publicar viaje</button></div><div class="toolbar"><input id="tripSearch" placeholder="Buscar origen, destino, cliente..." oninput="filterTrips()"><select id="tripStatus" onchange="filterTrips()"><option value="">Todos los estados</option>'+['Solicitado','Publicado','En curso','Entregado','Cancelado','Incidencia'].map(s=>'<option>'+s+'</option>').join('')+'</select></div><div id="tripList">'+tripTable(db.trips.slice().reverse())+'</div>'}
function filterTrips(){let q=$('#tripSearch').value.toLowerCase(),s=$('#tripStatus').value;$('#tripList').innerHTML=tripTable(db.trips.filter(t=>(!s||t.status===s)&&[t.origin,t.destination,t.client,t.driver,t.category,t.cargo].join(' ').toLowerCase().includes(q)).reverse())}
function openModal(title,html,onSubmit){$('#modalTitle').textContent=title;$('#modalForm').innerHTML=html+'<div class="dialogfoot"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Guardar</button></div>';$('#modal').classList.add('show');$('#modalForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target));closeModal()}}
function closeModal(){$('#modal').classList.remove('show')}
function field(label,name,value='',type='text',opts=''){return '<div class="field"><label>'+label+'</label>'+(type==='select'?'<select name="'+name+'">'+opts+'</select>':type==='textarea'?'<textarea name="'+name+'">'+esc(value)+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'">')+'</div>'}
function openTrip(t={}){let edit=!!t.id;openModal(edit?'Editar viaje':'Nuevo viaje', '<div class="formgrid">'+field('Tipo de servicio','category',t.category||'Contenedor','select',['Contenedor','Mudanza','Carga agrícola','Mercancía empresarial','Carga general'].map(x=>'<option '+(x===(t.category||'Contenedor')?'selected':'')+'>'+x+'</option>').join(''))+field('Fecha','date',t.date||new Date().toISOString().slice(0,10),'date')+field('Origen','origin',t.origin||'')+field('Destino','destination',t.destination||'')+field('Descripción de la carga','cargo',t.cargo||'')+field('Cliente','client',t.client||'')+field('Transportista','driver',t.driver||'')+field('Matrícula','vehicle',t.vehicle||'')+field('Precio al cliente','offer',t.offer||0,'number')+field('Importe transportista','driverPay',t.driverPay||0,'number')+field('Moneda','currency',t.currency||'USD','select','<option>USD</option><option>CUP</option>')+field('Estado','status',t.status||'Solicitado','select',['Solicitado','Publicado','En curso','Entregado','Cancelado','Incidencia'].map(x=>'<option '+(x===(t.status||'Solicitado')?'selected':'')+'>'+x+'</option>').join(''))+'</div>'+field('Notas','notes',t.notes||'','textarea'),f=>{let obj={...t,id:t.id||Date.now()};['category','date','origin','destination','cargo','client','driver','vehicle','currency','status','notes'].forEach(k=>obj[k]=f.get(k));['offer','driverPay'].forEach(k=>obj[k]=Number(f.get(k)||0));if(edit)db.trips=db.trips.map(x=>x.id===t.id?obj:x);else db.trips.push(obj);save();page('trips')})}
function editTrip(id){openTrip(db.trips.find(t=>t.id===id))}function advanceTrip(id){let t=db.trips.find(t=>t.id===id),states=['Solicitado','Publicado','En curso','Entregado'];let i=states.indexOf(t.status);t.status=states[(i+1)%states.length];save();page('trips')}
function genericList(kind){let cfg={drivers:{title:'Transportistas',desc:'Personas y empresas que realizan los servicios',fields:['name','type','phone','verified'],labels:['Nombre','Modalidad','Teléfono','Verificación']},clients:{title:'Clientes',desc:'Particulares, productores y empresas que solicitan transporte',fields:['name','type','phone'],labels:['Nombre','Tipo de cliente','Teléfono']},vehicles:{title:'Vehículos',desc:'Equipos disponibles y sus características',fields:['plate','kind','owner','capacity','status'],labels:['Matrícula','Tipo','Titular / responsable','Capacidad','Estado']}}[kind],arr=db[kind];$('#view').innerHTML='<div class="head"><div><h1>'+cfg.title+'</h1><div class="muted">'+cfg.desc+'</div></div><button class="btn" onclick="addRecord(\''+kind+'\')">＋ Añadir</button></div><div class="tablewrap"><table><thead><tr>'+cfg.labels.map(x=>'<th>'+x+'</th>').join('')+'<th>Acción</th></tr></thead><tbody>'+arr.map(x=>'<tr>'+cfg.fields.map(k=>'<td>'+esc(x[k]||'—')+'</td>').join('')+'<td><button class="link" onclick="removeRecord(\''+kind+'\','+x.id+')">Eliminar</button></td></tr>').join('')+'</tbody></table></div>'}
function addRecord(kind){let cfg={drivers:[['Nombre','name'],['Modalidad','type'],['Teléfono','phone'],['Verificación','verified']],clients:[['Nombre','name'],['Tipo','type'],['Teléfono','phone']],vehicles:[['Matrícula','plate'],['Tipo de vehículo','kind'],['Titular','owner'],['Capacidad','capacity'],['Estado','status']]}[kind];openModal('Añadir registro',cfg.map(([l,k])=>field(l,k,'')).join(''),f=>{let x={id:Date.now()};cfg.forEach(([l,k])=>x[k]=f.get(k));db[kind].push(x);save();page(kind)})}
function removeRecord(kind,id){if(confirm('¿Eliminar este registro?')){db[kind]=db[kind].filter(x=>x.id!==id);save();page(kind)}}
function drivers(){genericList('drivers')}function clients(){genericList('clients')}function vehicles(){genericList('vehicles')}
function finance(){let total=db.trips.reduce((a,t)=>a+(+t.offer||0),0),toDrivers=db.trips.reduce((a,t)=>a+(+t.driverPay||0),0),fee=total-toDrivers;$('#view').innerHTML='<div class="head"><div><h1>Finanzas y pagos</h1><div class="muted">Control administrativo de importes pactados; no procesa dinero</div></div></div><div class="notice">Los pagos bancarios, custodia de fondos y transferencias no están conectados. Este módulo registra acuerdos y comprobantes, pero no mueve dinero.</div><div class="grid"><div class="card kpi"><label>Importe ofertado</label><strong>'+money(total)+'</strong></div><div class="card kpi"><label>Importe transportistas</label><strong>'+money(toDrivers)+'</strong></div><div class="card kpi"><label>Margen estimado plataforma</label><strong>'+money(fee)+'</strong></div><div class="card kpi"><label>Tipo de cambio configurado</label><strong>'+Number(db.rate).toLocaleString('es')+' CUP</strong><small>Por USD · '+esc(db.rateSource)+'</small></div></div><div class="card" style="margin-top:14px"><h3 class="sectiontitle">Registrar estado de un pago</h3><button class="btn" onclick="addPayment()">＋ Registrar pago</button><div style="height:12px"></div><div class="tablewrap"><table><thead><tr><th>Viaje</th><th>Importe</th><th>Medio</th><th>Estado</th><th>Referencia</th></tr></thead><tbody>'+db.payments.map(p=>'<tr><td>#'+p.trip+'</td><td>'+money(p.amount,p.currency)+'</td><td>'+esc(p.method)+'</td><td>'+status(p.status)+'</td><td>'+esc(p.reference)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function addPayment(){openModal('Registrar pago', '<div class="formgrid">'+field('ID de viaje','trip','','number')+field('Importe','amount','','number')+field('Moneda','currency','USD','select','<option>USD</option><option>CUP</option>')+field('Medio','method','','select','<option>Efectivo</option><option>Transferencia</option><option>Otro</option>')+field('Estado','status','','select','<option>Pendiente</option><option>Pagado</option><option>En disputa</option>')+field('Referencia / comprobante','reference','')+'</div>',f=>{db.payments.push(Object.fromEntries(['trip','amount','currency','method','status','reference'].map(k=>[k,k==='trip'||k==='amount'?Number(f.get(k)):f.get(k)])));save();page('finance')})}
function settings(){$('#view').innerHTML='<div class="head"><div><h1>Configuración</h1><div class="muted">Parámetros comerciales y operativos</div></div></div><div class="card"><h3 class="sectiontitle">Tipo de cambio de referencia</h3><div class="formgrid">'+field('CUP por 1 USD','rate',db.rate,'number')+field('Fuente','rateSource',db.rateSource,'select','<option>Manual</option><option>elTOQUE API (pendiente de integración)</option><option>Otra fuente (manual)</option>')+field('Comisión de referencia (%)','commission',db.commission,'number')+'</div><button class="btn" onclick="saveSettings()">Guardar configuración</button><p class="muted">Última actualización: '+new Date(db.rateUpdated).toLocaleString('es')+'</p></div><div class="card" style="margin-top:14px"><h3 class="sectiontitle">Datos del prototipo</h3><p>Almacenamiento local del navegador. Para operar con varios administradores y teléfonos se necesita backend, base de datos, autenticación y permisos.</p><button class="btn secondary" onclick="exportData()">Exportar copia JSON</button> <button class="btn danger" onclick="resetData()">Restaurar datos de demostración</button></div>'}
function saveSettings(){let r=Number(document.querySelector('[name=rate]').value),c=Number(document.querySelector('[name=rateSource]').value);db.rate=r;db.rateSource=document.querySelector('[name=rateSource]').value;db.commission=Number(document.querySelector('[name=commission]').value);db.rateUpdated=new Date().toISOString();save();page('settings');alert('Configuración guardada')}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='cuba-ruta-respaldo.json';a.click();URL.revokeObjectURL(u)}
function resetData(){if(confirm('Esto reemplazará los datos actuales por los ejemplos iniciales. ¿Continuar?')){localStorage.removeItem(KEY);db=JSON.parse(JSON.stringify(seed));save();page('dashboard')}}
page('dashboard');
</script></body></html>
